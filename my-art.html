<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f45a1d">
  <meta name="description" content="邱馨平的視覺作品與創作實驗。">
  <title>MY ART — CHIU HSIN-PING</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--orange:#f45a1d;--paper:#f7f4ee;--mono:"DM Mono",monospace;--sans:"Montserrat",Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--orange);color:#fff;font-family:var(--sans);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .topbar{height:68px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;background:var(--paper);color:#24231f;position:relative;z-index:2}
    .brand{font:600 12px var(--sans);letter-spacing:.06em;white-space:nowrap}
    .nav{display:flex;gap:30px;position:absolute;left:50%;transform:translateX(-50%)}
    .nav a{font-size:12px;white-space:nowrap;transition:color .2s}
    .nav a:hover,.nav a.active{color:var(--orange)}
    .nav small{font:9px var(--mono);color:#999}
    .availability{font:9px var(--mono);letter-spacing:.08em;color:#777;white-space:nowrap}
    .availability i{display:inline-block;width:6px;height:6px;background:#72a16b;border-radius:50%;margin-right:8px}
    .art-hero{height:calc(100svh - 68px);min-height:480px;display:grid;place-items:center;position:relative;overflow:hidden}
    .hero-art{width:min(78vw,900px);height:auto;max-height:78svh;overflow:visible}
    .orbit{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-dasharray:1900;stroke-dashoffset:1900;animation:drawOrbit 2s cubic-bezier(.6,0,.3,1) forwards}
    .orbit.second{animation-delay:.18s}
    .hero-title{fill:#fff;font:300 68px var(--sans);letter-spacing:.04em;opacity:0;filter:blur(9px);animation:titleReveal 1.2s 1.5s cubic-bezier(.2,.65,.25,1) forwards}
    .hero-subtitle{fill:#fff;font:10px var(--mono);letter-spacing:.22em;opacity:0;animation:fadeIn .8s 2s ease-out forwards}
    .edge-label{position:absolute;left:5%;top:30px;font:9px var(--mono);letter-spacing:.1em;opacity:.8}
    .page-number{position:absolute;right:5%;bottom:28px;font:9px var(--mono);letter-spacing:.12em}
    html{overflow-x:hidden}
    body.page-enter-next main,body.page-enter-next footer{animation:pageEnterFromRight .52s cubic-bezier(.22,.7,.25,1)}
    body.page-enter-prev main,body.page-enter-prev footer{animation:pageEnterFromLeft .52s cubic-bezier(.22,.7,.25,1)}
    body.page-leave-next main,body.page-leave-next footer{animation:pageLeaveToLeft .48s cubic-bezier(.65,0,.8,.25) both;pointer-events:none}
    body.page-leave-prev main,body.page-leave-prev footer{animation:pageLeaveToRight .48s cubic-bezier(.65,0,.8,.25) both;pointer-events:none}
    @keyframes pageEnterFromRight{from{opacity:0}to{opacity:1}}
    @keyframes pageEnterFromLeft{from{opacity:0}to{opacity:1}}
    @keyframes pageLeaveToLeft{to{opacity:0}}
    @keyframes pageLeaveToRight{to{opacity:0}}
    @keyframes drawOrbit{to{stroke-dashoffset:0}}
    @keyframes titleReveal{to{opacity:1;filter:blur(0)}}
    @keyframes fadeIn{to{opacity:.85}}
    @media(max-width:700px){.topbar{height:62px;padding:0 6%}.brand{font-size:10px}.nav{gap:14px}.nav a{font-size:9px}.availability{display:none}.art-hero{height:calc(100svh - 62px);min-height:420px}.hero-art{width:94vw;max-height:70svh}.hero-title{font-size:clamp(38px,10vw,58px)}.edge-label{left:6%;top:22px;font-size:7px}.page-number{right:6%;bottom:22px}}
    @media(prefers-reduced-motion:reduce){.orbit,.hero-title,.hero-subtitle{animation:none;stroke-dashoffset:0;opacity:1;filter:none}body.page-enter-next main,body.page-enter-next footer,body.page-enter-prev main,body.page-enter-prev footer,body.page-leave-next main,body.page-leave-next footer,body.page-leave-prev main,body.page-leave-prev footer{animation-duration:.01ms}}
    .art-experience{height:min(850px,calc(100svh - 68px));min-height:590px;position:relative;overflow:hidden;background:var(--orange)}
    .my-art-marquee{position:absolute;z-index:0;inset:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));overflow:hidden;pointer-events:none}
    .my-art-marquee .marquee-column{height:100%;min-width:0;overflow:hidden;pointer-events:auto}
    .my-art-marquee .marquee-track{display:flex;flex-direction:column;width:100%}
    .my-art-marquee .marquee-set{display:flex;flex-direction:column;align-items:center;flex:none}
    .my-art-marquee .marquee-oval{display:grid;place-items:center;position:relative;flex:none;width:min(9vw,96px);height:58px;margin-top:-24px;border:0;border-radius:0;background:transparent;transform:none}
    .my-art-marquee .marquee-letter{display:block;color:#fff;font:600 10px/1 var(--mono);letter-spacing:0;opacity:.86}
    .art-experience.show-gallery .my-art-marquee{visibility:hidden}
    .category-layer{z-index:1;pointer-events:none}
    .screen-label,.category-map{pointer-events:none}
    .category-link{pointer-events:all}
    .intro-layer,.category-layer{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .75s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
    .intro-layer{animation:introExit .85s 2.25s cubic-bezier(.6,0,.3,1) forwards}
    .category-layer{opacity:0;transform:scale(.86);animation:categoryEnter .9s 2.2s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes introExit{to{opacity:0;transform:scale(1.12);visibility:hidden}}
    @keyframes categoryEnter{to{opacity:1;transform:scale(1)}}
    .category-map{display:block;width:min(78vw,900px);height:auto;max-height:76svh;overflow:visible}
    .category-mask{fill:var(--orange);stroke:none;opacity:0;animation:category-mask-reveal 1.25s .2s ease-out forwards}
    @keyframes category-mask-reveal{to{opacity:1}}
    .category-link{cursor:pointer;outline:none}
    .category-fill{fill:rgba(255,255,255,.72);opacity:0;pointer-events:none;filter:none;transition:opacity .7s cubic-bezier(.22,.61,.36,1)}
    .category-map:has([data-category="Sketch"]:hover,[data-category="Sketch"]:focus-visible,[data-category="Sketch"].is-selected) .fill-sketch,
    .category-map:has([data-category="Storyboard"]:hover,[data-category="Storyboard"]:focus-visible,[data-category="Storyboard"].is-selected) .fill-storyboard,
    .category-map:has([data-category="Animation"]:hover,[data-category="Animation"]:focus-visible,[data-category="Animation"].is-selected) .fill-animation,
    .category-map:has([data-category="Project"]:hover,[data-category="Project"]:focus-visible,[data-category="Project"].is-selected) .fill-project,
    .category-map:has([data-category="Illustration"]:hover,[data-category="Illustration"]:focus-visible,[data-category="Illustration"].is-selected) .fill-illustration{opacity:1}
    .category-link text{fill:#fff;font:500 24px var(--sans);text-anchor:middle;transition:fill .25s,letter-spacing .25s,opacity .25s}
    .category-link.outer-category text{font-size:28px}
    .category-link.primary-category text{font-size:32px}
    .category-link:hover text,.category-link:focus-visible text{fill:var(--orange);letter-spacing:.06em}
    .category-link:hover .category-dot,.category-link:focus-visible .category-dot{opacity:1;r:7}
    .category-dot{fill:#fff;opacity:0;transition:opacity .2s}
    .screen-label{position:absolute;left:5%;top:auto;bottom:28px;display:flex;flex-direction:column;gap:4px;padding:8px 18px;border:1px solid #fff;border-radius:7px;background:var(--orange);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;color:#fff;font:700 12px/1.25 var(--mono);letter-spacing:.12em;opacity:1}
    .screen-label .label-cn{font:11px var(--sans);letter-spacing:.14em}
    .screen-count{position:absolute;right:5%;bottom:28px;font:9px var(--mono);letter-spacing:.12em}
    .ai-training-notice{position:absolute;z-index:2;right:5%;bottom:28px;max-width:90%;box-sizing:border-box;margin:0;padding:10px 14px;background:var(--orange);color:#fff;font:700 16px/1.5 var(--mono);letter-spacing:.04em;text-align:right}
    .gallery-layer{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:24px;background:rgba(32,27,23,.42);backdrop-filter:blur(5px);color:#24231f;overflow:auto;opacity:0;visibility:hidden;transition:opacity .28s ease,visibility .28s ease}
    .art-experience.show-gallery .gallery-layer{opacity:1;visibility:visible}
    .gallery-window{width:min(1000px,94%);max-height:100%;overflow:auto;padding:34px 5%;background:var(--paper);box-shadow:0 24px 70px rgba(25,19,15,.25);opacity:0;transform:translateY(12px) scale(.97);transition:opacity .24s ease,transform .3s cubic-bezier(.22,.7,.2,1)}
    .art-experience.show-gallery .gallery-window{opacity:1;transform:translateY(0) scale(1)}
    .gallery-category-arrow{position:absolute;z-index:5;top:50%;width:64px;height:84px;display:grid;place-items:center;padding:0;border:0;background:transparent;color:#fff;cursor:pointer;transform:translateY(-50%);transition:color .2s,transform .2s}
    .gallery-category-arrow svg{display:block;width:58px;height:58px;overflow:visible}
    .gallery-category-arrow path{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:square;stroke-linejoin:miter}
    .gallery-category-arrow:hover{color:#fff}
    .gallery-category-arrow.previous:hover{transform:translate(-4px,-50%)}.gallery-category-arrow.next:hover{transform:translate(4px,-50%)}
    .gallery-category-arrow:focus-visible{outline:1px solid currentColor;outline-offset:2px}
    .gallery-category-arrow.previous{left:8px}.gallery-category-arrow.next{right:8px}
    .art-experience.show-gallery.is-closing-gallery .my-art-marquee{visibility:visible}
    .art-experience.show-gallery.is-closing-gallery .gallery-layer{pointer-events:auto}
    .art-experience.show-gallery .category-fill{opacity:0}
    .gallery-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:0 auto 32px;max-width:1200px}
    .art-experience.show-gallery .gallery-head>div{animation:galleryCardIn .7s .08s cubic-bezier(.22,.68,.24,1) both}
    .gallery-kicker{margin:0 0 12px;font:9px var(--mono);letter-spacing:.12em;color:#888}
    .gallery-title{margin:0;font-size:clamp(38px,5.2vw,64px);font-weight:300;letter-spacing:-.045em}
    .gallery-back{width:38px;height:38px;display:grid;place-items:center;border:1px solid #c9c4ba;background:transparent;padding:0;cursor:pointer;color:#625e58}
    .gallery-back:hover{color:var(--orange);border-color:var(--orange)}
    .close-icon{display:block;font:300 29px/1 var(--sans);transition:color .2s ease}
    .close-icon{transform:rotate(0);transform-origin:center}
    .art-experience.show-gallery .close-icon{animation:closeSpin 1.1s cubic-bezier(.16,1,.3,1) both}
    .gallery-back:hover .close-icon{animation:closeSpin 1.1s cubic-bezier(.16,1,.3,1) both}
    @keyframes closeSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    .gallery-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
    .work-card{padding:0;border:0;background:none;text-align:left;cursor:pointer;color:inherit;min-width:0}
    .work-card.is-pending{opacity:0;transform:translateY(30px)}
    .art-experience.show-gallery .work-card.is-visible{animation:galleryCardIn .7s cubic-bezier(.22,.68,.24,1) both}
    @keyframes galleryTextIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes galleryCardIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    .work-art{display:block;width:100%;aspect-ratio:4/3;overflow:hidden;background:#e8e1d7;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
    .work-art:has(img){aspect-ratio:1/1}
    .work-art img{display:block;width:100%;height:100%;object-fit:cover}
    .work-card:not(.editorial-card):hover .work-art{transform:translateY(-5px)}
    .work-art svg{display:block;width:100%;height:100%}
    .work-name{display:block;margin-top:13px;font-size:12px;letter-spacing:.02em}
    .storyboard-work-name{font-size:clamp(14px,1.45vw,17px);font-weight:600;line-height:1.35;letter-spacing:.01em}
    .work-meta{display:block;margin-top:5px;font:8px var(--mono);letter-spacing:.1em;color:#888}
    .editorial-grid{grid-template-columns:1fr;gap:18px}
    .editorial-card{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(240px,.85fr);align-items:stretch;border:1px solid #ded9d0;background:var(--paper);transition:translate .45s cubic-bezier(.2,.7,.2,1)}
    .editorial-card:hover{translate:0 -5px}
    .editorial-card .work-art{aspect-ratio:16/10;align-self:start;height:auto}
    .editorial-copy{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:12px;padding:12px clamp(18px,2vw,24px);font-family:var(--sans)}
    .editorial-copy .work-meta,.editorial-copy .work-action{font-family:var(--sans)}
    .editorial-copy .work-name{margin:0;font-size:clamp(18px,2.2vw,26px)}
    .editorial-copy .work-meta{font-size:9px}
    .work-summary{display:-webkit-box;margin:0;overflow:hidden;color:#68635c;font:400 13px/1.8 var(--sans);-webkit-box-orient:vertical;-webkit-line-clamp:3}
    .work-summary::after{content:" ... (more)";color:var(--orange);white-space:nowrap}
    .work-action{color:var(--orange);font:10px var(--mono);letter-spacing:.1em}
.full-film-link{display:inline-flex;align-self:flex-end;margin:0;padding:16px 24px;background:var(--orange);color:#fff;font:600 14px var(--mono);letter-spacing:.06em;text-decoration:none;transition:background .2s ease}
    .full-film-link:hover{background:#d94813}
    .roles-banner{display:flex;align-items:center;gap:24px;margin-top:8px;padding:18px 26px;background:#efe9df;border-left:8px solid var(--orange)}
    .roles-banner p{margin:0 0 6px;color:#827e76;font:9px var(--mono);letter-spacing:.1em}
    .roles-list{display:flex;flex-wrap:wrap;gap:4px 14px;color:#24231f;font:500 14px/1.6 var(--sans)}
    .roles-list span{display:inline-flex;align-items:center;gap:7px}
    .roles-list span::before{content:"";width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:var(--orange)}
    @keyframes rolesBannerIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes roleItemIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    .animation-subview:not([hidden]) .roles-banner{animation:rolesBannerIn .5s .12s cubic-bezier(.22,.68,.24,1) both}
    .animation-subview:not([hidden]) .roles-list span{animation:roleItemIn .36s .24s ease-out both}
    .animation-subview:not([hidden]) .roles-list span:nth-child(2){animation-delay:.3s}
    .animation-subview:not([hidden]) .roles-list span:nth-child(3){animation-delay:.36s}
    .animation-subview:not([hidden]) .roles-list span:nth-child(4){animation-delay:.42s}
    .animation-subview:not([hidden]) .roles-list span:nth-child(5){animation-delay:.48s}
    .animation-subview:not([hidden]) .roles-list span:nth-child(6){animation-delay:.54s}
    @media(prefers-reduced-motion:reduce){.animation-subview:not([hidden]) .roles-banner,.animation-subview:not([hidden]) .roles-list span{animation:none}}
    .animation-choice-grid{display:grid;width:min(980px,100%);grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:0 auto}
    .animation-choice-header{position:relative;display:flex;align-items:center;justify-content:center;min-height:76px;margin:0 auto 4px;width:min(980px,100%)}
    .animation-choice-title{margin:0;color:#24231f;font:700 clamp(30px,4vw,42px)/1.1 var(--sans);letter-spacing:.02em;text-align:center}
    .animation-return-to-gallery{position:absolute;left:0;top:50%;transform:translateY(-50%);padding:9px 12px;border:1px solid var(--orange);background:transparent;color:var(--orange);font:600 12px var(--mono);letter-spacing:.1em;cursor:pointer}
    .animation-return-to-gallery:hover{background:var(--orange);color:#fff}
    .modal-panel.editorial-detail:has(.animation-choice-grid:not([hidden])) #modal-title{display:none}
    .modal-panel.editorial-detail:has(.animation-choice-grid[hidden]) .animation-choice-header{display:none}
    .animation-choice-grid[hidden],.animation-subview[hidden]{display:none!important}
    .animation-choice{display:flex;min-width:0;min-height:280px;flex-direction:column;gap:14px;padding:20px;border:1px solid #ded8ce;background:#f8f5ef;color:#24231f;text-align:left;cursor:pointer;transition:transform .2s ease,border-color .2s ease}
    .animation-choice:hover{transform:translateY(-4px);border-color:var(--orange)}
    .animation-choice h3,.animation-subview h3{margin:0;color:#827e76;font:10px var(--mono);letter-spacing:.12em}
    .animation-choice h3{color:var(--orange);font-size:12px;font-weight:600;letter-spacing:.14em}
    .animation-subview h3{color:#24231f;font-size:15px;font-weight:700;letter-spacing:.14em}
    .animation-choice-main{display:block;width:100%;height:190px;object-fit:cover;background:#ebe7e0}
    .animation-choice-art-preview{display:grid;width:100%;height:auto;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
    .animation-choice-art-preview img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;background:#ebe7e0}
    .animation-choice-caption{margin:auto 0 0;color:#68635c;font:12px/1.7 var(--sans)}
    .animation-subview{display:flex;flex-direction:column;gap:16px;width:100%}
    @keyframes animationSubviewPop{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    .animation-subview:not([hidden]){animation:animationSubviewPop .58s .03s cubic-bezier(.22,.68,.24,1) both}
    @media(prefers-reduced-motion:reduce){.animation-subview:not([hidden]){animation:none}}
    .modal-panel.editorial-detail:has(.animation-choice-grid:not([hidden])) .modal-copy{flex:1 1 auto;justify-content:center}
    .modal-panel.editorial-detail:has(.animation-choice-grid:not([hidden])) .modal-detail{flex:1 1 auto;justify-content:center}
    .modal-panel.editorial-detail:has(.animation-choice-grid:not([hidden])) .modal-nav-group{display:none!important}
    .modal-panel.editorial-detail:has([data-animation-content="art"]:not([hidden])):has(.animation-art-viewer[hidden]) .modal-nav-group{display:none!important}
    .animation-back{align-self:flex-start;padding:8px 12px;border:1px solid var(--orange);background:transparent;color:var(--orange);font:600 12px var(--mono);letter-spacing:.12em;cursor:pointer}
    .animation-back:hover{background:var(--orange);color:#fff}
    .animation-film-content{display:flex;flex-direction:column;gap:14px;padding:20px;border:1px solid #ded8ce;background:#f8f5ef}
    .modal-panel.editorial-detail .animation-film-content .modal-image{display:flex;align-self:center;width:fit-content;max-width:100%;min-height:0;height:auto;max-height:none;margin:0 auto;padding:0;background:#171613}
    .modal-panel.editorial-detail .animation-film-content #modal-image>video,.modal-panel.editorial-detail .animation-film-content #modal-image>img{display:block!important;width:auto!important;height:auto!important;max-width:100%!important;max-height:42svh!important;object-fit:contain!important}
    .animation-film-content .editorial-thumbnails{margin-inline:auto}
    .animation-film-content>.full-film-link{margin-top:-6px}
    .animation-film-content>.full-film-link+.roles-banner{margin-top:-8px}
    .modal-panel.editorial-detail .modal-copy .modal-detail .animation-film-content>p{width:100%;align-self:stretch}
    .animation-film-content .roles-banner{margin-top:8px}
    .animation-art-gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .development-art-thumb{display:block;width:100%;aspect-ratio:1;padding:0;overflow:hidden;border:1px solid #ded8ce;background:#ebe7e0;cursor:zoom-in}
    .development-art-thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .25s ease}
    .development-art-thumb:hover img{transform:scale(1.04)}
    .animation-art-viewer[hidden]{display:none!important}
    .development-art-list[hidden]{display:none!important}
    .animation-art-viewer{display:flex;flex-direction:column;align-items:center;gap:14px}
    .animation-art-viewer .art-viewer-stage{display:flex;justify-content:center;width:100%;min-height:0}
    .animation-art-viewer .art-viewer-image{display:block;width:auto;height:auto;max-width:100%;max-height:68svh;object-fit:contain;background:transparent}
    .art-image-count{color:#827e76;font:10px var(--mono);letter-spacing:.08em}
    .development-art-group{display:flex;flex-direction:column;gap:10px;padding-top:18px;border-top:1px solid #ded8ce}
    .development-art-group h4{margin:0;color:#24231f;font:600 12px var(--mono);letter-spacing:.12em}
    .development-art-group-character .animation-art-gallery,.development-art-group-scene .animation-art-gallery{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
    .development-art-group-character .development-art-thumb,.development-art-group-scene .development-art-thumb{flex:0 1 calc((100% - 24px)/3);max-width:260px}
